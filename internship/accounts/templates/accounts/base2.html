{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}InternHub{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'accounts/css/style.css' %}"
    >

    {% block css %}{% endblock %}

</head>


<body>




<!-- =====================================================
     MESSAGES
===================================================== -->

{% if messages %}

    <div class="messages-container">

        {% for message in messages %}

            <div class="message {{ message.tags }}">
                {{ message }}
            </div>

        {% endfor %}

    </div>

{% endif %}



<!-- =====================================================
     PAGE CONTENT
===================================================== -->

<main>

    {% block content %}
    {% endblock %}

</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="footer">

    <div class="footer-container">

        <div>

            <h3>
                Intern<span>Hub</span>
            </h3>

            <p>
                Internship management made simple.
            </p>

        </div>


        <div class="footer-right">

            © 2026 Taj mim

        </div>

    </div>

</footer>


</body>

</html>
